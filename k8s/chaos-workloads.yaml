apiVersion: v1
kind: Namespace
metadata:
  name: immune-core
---
apiVersion: v1
kind: Namespace
metadata:
  name: industrial-scada
---
# Scenario 1: CrashLoopBackOff Anomaly
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-tester
  namespace: immune-core
  labels:
    app: crashloop-tester
    biopods.io/chaos: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-tester
  template:
    metadata:
      labels:
        app: crashloop-tester
    spec:
      containers:
        - name: crash-container
          image: busybox:1.36
          command: ["sh", "-c", "echo 'Starting service initialization...'; sleep 5; echo 'Fatal deadlock encountered'; exit 1"]
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
---
# Scenario 2: OOMKill Heap Leak Anomaly
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-tester
  namespace: immune-core
  labels:
    app: oom-tester
    biopods.io/chaos: oomkill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-tester
  template:
    metadata:
      labels:
        app: oom-tester
    spec:
      containers:
        - name: leak-container
          image: busybox:1.36
          command: ["sh", "-c", "tail /dev/zero"]
          resources:
            limits:
              memory: 32Mi
---
# Scenario 3: CPU Saturation Anomaly
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-burner
  namespace: industrial-scada
  labels:
    app: cpu-burner
    biopods.io/chaos: cpu-saturation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-burner
  template:
    metadata:
      labels:
        app: cpu-burner
    spec:
      containers:
        - name: burn-container
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]
          resources:
            requests:
              cpu: 100m
            limits:
              cpu: 250m
---
# Scenario 4: Broken Probe Anomaly
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-failure-tester
  namespace: industrial-scada
  labels:
    app: probe-failure-tester
    biopods.io/chaos: failed-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe-failure-tester
  template:
    metadata:
      labels:
        app: probe-failure-tester
    spec:
      containers:
        - name: nginx-broken-probe
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /non-existent-health-check
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Scenario 5: Unschedulable Pending Pod Anomaly
apiVersion: v1
kind: Pod
metadata:
  name: pending-unschedulable-tester
  namespace: immune-core
  labels:
    app: pending-tester
    biopods.io/chaos: pending-pod
spec:
  nodeSelector:
    disktype: biological-quantum-nvme
  containers:
    - name: wait-container
      image: busybox:1.36
      command: ["sleep", "3600"]
