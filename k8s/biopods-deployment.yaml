apiVersion: v1
kind: ConfigMap
metadata:
  name: biopods-config
  namespace: biopods-system
data:
  PORT: "3000"
  AUTONOMY_LEVEL: "3"
  REQUIRE_APPROVAL_FOR_HIGH_RISK: "true"
  KUBERNETES_MODE: "cluster"
  PROMETHEUS_URL: "http://prometheus-k8s.monitoring.svc:9090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biopods-orchestrator
  namespace: biopods-system
  labels:
    app.kubernetes.io/name: biopods
    app.kubernetes.io/component: immune-kernel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: biopods
  template:
    metadata:
      labels:
        app: biopods
    spec:
      serviceAccountName: biopods-controller
      containers:
        - name: biopods-core
          image: biopods/orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-web
          envFrom:
            - configMapRef:
                name: biopods-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: biopods-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: biopods-service
  namespace: biopods-system
  labels:
    app: biopods
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      name: http
  selector:
    app: biopods
