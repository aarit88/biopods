# Pyrefly configuration for agent-dendritic service
# https://pyrefly.org/en/stable/configuration/

[python]
python_version = "3.11"

[project]
# Exclude Pyrefly's own in-memory virtual documents.
# These cause false-positive parse errors because individual await-expressions
# are extracted from their enclosing async function and analysed in isolation.
exclude = ["d:/__pyrefly_virtual__/**"]
